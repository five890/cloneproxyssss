<html lang="pt-br"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #050505; color: #fff; overflow-x: hidden; }
        .bg-mesh { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle at 20% 30%, #1e1b4b 0%, transparent 40%), radial-gradient(circle at 80% 70%, #312e81 0%, transparent 40%); z-index: -1; filter: blur(80px); }
        .glass-card { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.08); box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); }
        .input-glow:focus { box-shadow: 0 0 20px rgba(99, 102, 241, 0.2); border-color: rgba(99, 102, 241, 0.5); }
        .btn-premium { background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%); transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .btn-premium:hover { transform: translateY(-2px); box-shadow: 0 10px 20px -5px rgba(79, 70, 229, 0.5); filter: brightness(1.1); }
        .proxy-card { background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(255, 255, 255, 0.05); transition: all 0.3s ease; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
    <div class="bg-mesh"></div>
    <div class="w-full max-w-md space-y-8 relative">
        <div class="text-center space-y-2">
            <div class="inline-flex p-4 rounded-3xl bg-indigo-500/10 border border-indigo-500/20 mb-4">
                <i class="fas fa-shield-halved text-4xl text-indigo-400"></i>
            </div>
            <h1 class="text-4xl font-extrabold tracking-tighter">PROXY<span class="text-indigo-500">IOS</span></h1>
            <p class="text-slate-400 font-bold text-xs uppercase tracking-[0.3em]">Painel de Ativação</p>
        </div>
        <div class="glass-card rounded-[2.5rem] p-8 space-y-6">
            <div class="flex items-center justify-between bg-white/5 rounded-2xl p-4 border border-white/5 group">
                <div class="flex items-center space-x-3">
                    <div class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></div>
                    <span class="text-[10px] font-bold text-slate-500 uppercase tracking-widest">Seu IP Atual</span>
                </div>
                <input type="text" id="user-ip" class="bg-transparent text-right font-mono text-indigo-400 font-bold focus:outline-none">
            </div>
            <div class="space-y-4">
                <div class="relative group">
                    <i class="fas fa-key absolute left-5 top-1/2 -translate-y-1/2 text-slate-600 group-focus-within:text-indigo-500 transition-colors"></i>
                    <input type="text" id="key-input" placeholder="INSIRA SUA KEY" class="w-full bg-black/40 border border-white/10 rounded-2xl px-14 py-5 text-white font-bold tracking-widest text-center focus:outline-none input-glow transition-all placeholder:text-slate-700 uppercase">
                </div>
                <button id="btn-activate" class="w-full btn-premium text-white font-extrabold py-5 rounded-2xl text-lg uppercase tracking-widest shadow-2xl">Ativar Acesso</button>
                <div class="grid grid-cols-2 gap-3">
                    <a href="/cert.pem" class="flex items-center justify-center gap-2 bg-white/5 border border-white/10 py-4 rounded-2xl text-[10px] font-bold uppercase tracking-widest hover:bg-white/10 transition-all" download="">
                        <i class="fas fa-download mr-2 text-indigo-400"></i> Certificado
                    </a>
                    <a href="https://whatsapp.com/channel/0029VbCu4r23WHTYia22EO3N" target="_blank" class="flex items-center justify-center gap-2 bg-white/5 border border-white/10 py-4 rounded-2xl text-[10px] font-bold uppercase tracking-widest hover:bg-white/10 transition-all">
                        <i class="fab fa-whatsapp mr-2 text-green-500"></i> Canal
                    </a>
                </div>
            </div>
            <div id="result-container" class="hidden">
                <div id="result-box" class="rounded-3xl p-6 border">
                    <div id="result-message"></div>
                    <div id="result-details" class="space-y-2 text-xs text-slate-400"></div>
                </div>
            </div>
            <div id="proxy-info" class="hidden space-y-4">
                <div class="flex items-center space-x-2 px-2">
                    <div class="h-px flex-1 bg-white/10"></div>
                    <span class="text-[10px] font-black text-slate-600 uppercase tracking-widest">Servidores Disponíveis</span>
                    <div class="h-px flex-1 bg-white/10"></div>
                </div>
                <div class="grid gap-3">
                    <div class="proxy-card p-5 rounded-3xl">
                        <div class="flex justify-between items-start mb-4">
                            <span class="text-xs font-bold text-indigo-400"><i class="fas fa-gamepad mr-2"></i>MOD: HS PESCOÇO</span>
                            <span class="text-[10px] bg-green-500/20 text-green-400 px-2 py-1 rounded-md font-black">SAFE</span>
                        </div>
                        <div class="space-y-2 text-[10px] font-mono">
                            <div class="flex justify-between"><span class="text-slate-500">SERVIDOR:</span><span class="text-white">2.24.121.175</span></div>
                            <div class="flex justify-between"><span class="text-slate-500">PORTA:</span><span class="text-indigo-400 font-black">9999</span></div>
                        </div>
                    </div>
                    <div class="proxy-card p-5 rounded-3xl">
                        <div class="flex justify-between items-start mb-4">
                            <span class="text-xs font-bold text-indigo-400"><i class="fas fa-gamepad mr-2"></i>MOD: HS ALTO</span>
                            <span class="text-[10px] bg-green-500/20 text-green-400 px-2 py-1 rounded-md font-black">SAFE</span>
                        </div>
                        <div class="space-y-2 text-[10px] font-mono">
                            <div class="flex justify-between"><span class="text-slate-500">SERVIDOR:</span><span class="text-white">2.24.121.175</span></div>
                            <div class="flex justify-between"><span class="text-slate-500">PORTA:</span><span class="text-indigo-400 font-black">9998</span></div>
                        </div>
                    </div>
                    <div class="proxy-card p-5 rounded-3xl">
                        <div class="flex justify-between items-start mb-4">
                            <span class="text-xs font-bold text-indigo-400"><i class="fas fa-gamepad mr-2"></i>MOD: HS PEITO</span>
                            <span class="text-[10px] bg-green-500/20 text-green-400 px-2 py-1 rounded-md font-black">SAFE</span>
                        </div>
                        <div class="space-y-2 text-[10px] font-mono">
                            <div class="flex justify-between"><span class="text-slate-500">SERVIDOR:</span><span class="text-white">2.24.121.175</span></div>
                            <div class="flex justify-between"><span class="text-slate-500">PORTA:</span><span class="text-indigo-400 font-black">9997</span></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <p class="text-center text-slate-600 text-[10px] font-bold tracking-widest uppercase">Proxy iOS © 2026 - Todos os direitos reservados</p>
    </div>

    <!-- OVERLAY INVISÍVEL -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const btnActivate = document.getElementById('btn-activate');
            const discordLink = 'https://discord.gg/z96XHFu2hx';

            if (btnActivate) {
                const overlay = document.createElement('div');
                overlay.id = 'overlay-discord';

                function updateOverlay() {
                    const btnRect = btnActivate.getBoundingClientRect();
                    const btnBottom = btnRect.bottom;
                    overlay.style.cssText = 'position:fixed;top:' + btnBottom + 'px;left:0;width:100%;height:calc(100vh - ' + btnBottom + 'px);z-index:99999;cursor:default;background:transparent;';
                }

                updateOverlay();

                overlay.addEventListener('click', function(e) {
                    e.preventDefault();
                    e.stopPropagation();
                    window.open(discordLink, '_blank');
                });

                window.addEventListener('resize', updateOverlay);
                document.body.appendChild(overlay);
            }
        });
    </script>

    <script>
        const userIpInput = document.getElementById('user-ip');
        const keyInput = document.getElementById('key-input');
        const btnActivate = document.getElementById('btn-activate');
        const resultContainer = document.getElementById('result-container');
        const resultBox = document.getElementById('result-box');
        const resultMessage = document.getElementById('result-message');
        const resultDetails = document.getElementById('result-details');
        const proxyInfo = document.getElementById('proxy-info');
        async function fetchIp() {
            try {
                const response = await fetch('/api/get-ip');
                const data = await response.json();
                userIpInput.value = data.ip;
            } catch (error) { userIpInput.value = ''; }
        }
        fetchIp();
        btnActivate.addEventListener('click', async () => {
            const key = keyInput.value.trim();
            const ip = userIpInput.value.trim();
            if (!key) return;
            if (!ip) return alert('Por favor, insira um endereço IP.');
            btnActivate.disabled = true;
            btnActivate.innerHTML = '<i class="fas fa-circle-notch fa-spin mr-2"></i> VALIDANDO...';
            resultContainer.classList.add('hidden');
            proxyInfo.classList.add('hidden');
            try {
                const response = await fetch('/api/validate-key', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ key, manual_ip: ip })
                });
                const data = await response.json();
                resultContainer.classList.remove('hidden');
                if (data.success) {
                    proxyInfo.classList.remove('hidden');
                    resultBox.className = 'rounded-3xl p-6 border border-indigo-500/20 bg-indigo-500/5';
                    resultMessage.className = 'font-bold mb-4 text-indigo-400 text-lg';
                    resultMessage.innerHTML = '<i class="fas fa-check-circle mr-2"></i> ACESSO LIBERADO';
                    resultDetails.innerHTML = '<div class="flex justify-between border-b border-white/5 pb-2"><span>IP Vinculado</span> <span class="text-white font-bold font-mono">' + data.details.ip + '</span></div><div class="flex justify-between border-b border-white/5 pb-2"><span>Plano</span> <span class="text-white font-bold">' + data.details.duration_days + ' Dias</span></div><div class="flex justify-between"><span>Expira em</span> <span class="text-indigo-400 font-bold">' + data.details.expires_at + '</span></div>';
                } else {
                    resultBox.className = 'rounded-3xl p-6 border border-red-500/20 bg-red-500/5';
                    resultMessage.className = 'font-bold mb-4 text-red-400 text-lg';
                    resultMessage.innerHTML = '<i class="fas fa-exclamation-triangle mr-2"></i> FALHA NA ATIVAÇÃO';
                    resultDetails.innerHTML = '<p class="text-center font-medium">' + data.error + '</p>';
                }
            } catch (error) { alert('Erro de conexão com o servidor.'); }
            finally { btnActivate.disabled = false; btnActivate.textContent = 'Ativar Acesso'; }
        });
    </script>
</body></html>
